[base]
package = ocean
env_name = puffer_escape_room
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 40

[rnn]
input_size = 128
hidden_size = 128

[policy]
hidden_size = 128

[train]
total_timesteps = 1_000_000
gamma = 0.99
checkpoint_interval = 50000
update_epochs = 3
learning_rate = 0.0003
batch_size = 20480
minibatch_size = 512
